name: BlackFist Validate
on:
  push:
    branches: [blackfist-motion-studio]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          set -o pipefail
          pnpm exec tsc --noEmit 2>&1 | tee typecheck.log
      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackfist-typecheck
          path: typecheck.log
      - name: Lint\n        run: |\n          set -o pipefail\n          pnpm lint 2>&1 | tee lint.log\n      - name: Upload lint report\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: blackfist-lint\n          path: lint.log
      - run: pnpm build
