name: BlackFist Validate
on:
  push:
    branches: [blackfist-motion-studio]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          set -o pipefail
          pnpm exec tsc --noEmit 2>&1 | tee typecheck.log
      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackfist-typecheck
          path: typecheck.log
      - name: Lint
        run: |
          set -o pipefail
          pnpm exec eslint . --max-warnings=9999 2>&1 | tee lint.log
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackfist-lint
          path: lint.log
      - name: BlackFist database migration smoke test
        run: bash scripts/blackfist-migrations-smoke.sh
      - name: FFmpeg review MP4 smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          bash scripts/blackfist-review-mux-smoke.sh
      - name: Production build
        if: always()
        run: pnpm build
