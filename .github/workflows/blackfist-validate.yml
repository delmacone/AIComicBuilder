name: BlackFist Validate
on:
  push:
    branches: [blackfist-motion-studio]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck\n        run: pnpm exec tsc --noEmit 2>&1 | tee typecheck.log\n      - name: Upload typecheck report\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: blackfist-typecheck\n          path: typecheck.log
      - run: pnpm lint
      - run: pnpm build
